name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 packages OCaml 4.14.1, the version the README names.
          - os: ubuntu-24.04
            ocaml: system
          - os: macos-latest
            ocaml: '5'
    runs-on: ${{ matrix.os }}
    # setup-ocaml builds opam, which can take several minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install OCaml (apt)
        if: matrix.ocaml == 'system'
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox
      - name: Install OCaml (opam)
        if: matrix.ocaml != 'system'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      # Linux runs the non-UTF-8 file name test, which APFS cannot host.
      - name: Test
        if: matrix.ocaml == 'system'
        run: make test
      - name: Test (opam)
        if: matrix.ocaml != 'system'
        run: opam exec -- make test
